services:
  - type: web
    name: signaliq
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn backend.main:app -k uvicorn.workers.UvicornWorker
    envVars:
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: KEYGEN_ACCOUNT_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
